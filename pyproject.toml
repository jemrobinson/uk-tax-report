[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uk-tax-report"
version = "0.2.0"
description = "UK tax report and capital gains calculator for Portfolio Performance"
readme = "README.md"
authors = [
    { name = "James Robinson", email = "james.em.robinson@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "defusedxml>=0.7.1",
    "pandas>1.3",
    "py-moneyed>2.0",
    "python-dateutil>2.8",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
]

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
    "ANN001",   # missing type annotation for function argument
    "ANN002",   # missing type annotation for **args
    "ANN003",   # missing type annotation for **kwargs
    "ANN201",   # missing return type annotation for public function
    "ANN204",   # missing type annotation for __init__
    "C901",     # too complex
    "COM812",   # missing-trailing-comma [conflicts with formatter]
    "D105",     # missing docstring in magic method
    "D107",     # missing docstring in __init__
    "D203",     # one-blank-line-before-class [conflicts with D211]
    "D213",     # multi-line-summary-second-line [conflicts with D212]
    "FA100",    # add `from __future__ import annotations` to simplify `typing.Union`
    "PLR0913",  # too many arguments in function definition
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["uk_tax_report"]
